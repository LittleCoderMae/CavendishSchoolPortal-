{% extends "base.html" %}

{% block title %}Lecturer Dashboard{% endblock %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-md-12">
            <h1 class="mb-4">Lecturer Dashboard</h1>
            <div class="row">
                <div class="col-md-4 mb-4">
                    <div class="card">
                        <div class="card-body text-center">
                            <h3><i class="fas fa-chalkboard-teacher text-primary"></i></h3>
                            <h5>My Courses</h5>
                            <p class="text-muted">Manage your assigned courses</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 mb-4">
                    <div class="card">
                        <div class="card-body text-center">
                            <h3><i class="fas fa-chart-line text-success"></i></h3>
                            <h5>Results</h5>
                            <p class="text-muted">Enter and manage student results</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 mb-4">
                    <div class="card">
                        <div class="card-body text-center">
                            <h3><i class="fas fa-users text-info"></i></h3>
                            <h5>Students</h5>
                            <p class="text-muted">View your student roster</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
