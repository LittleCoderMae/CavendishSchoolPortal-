{% extends "base.html" %}

{% block content %}
<div class="container">
    <h1>Lecturer Dashboard</h1>
    <p>Welcome, {{ current_user.first_name }} {{ current_user.last_name }}</p>
    
    <div class="row">
        <div class="col s12 m4">
            <div class="card blue lighten-1">
                <div class="card-content white-text">
                    <span class="card-title">Students</span>
                    <p>Manage your students</p>
                </div>
                <div class="card-action">
                    <a href="{{ url_for('lecturer.students') }}" class="white-text">View Students</a>
                </div>
            </div>
        </div>
        
        <div class="col s12 m4">
            <div class="card green lighten-1">
                <div class="card-content white-text">
                    <span class="card-title">Results</span>
                    <p>Manage student results</p>
                </div>
                <div class="card-action">
                    <a href="{{ url_for('lecturer.results') }}" class="white-text">Manage Results</a>
                </div>
            </div>
        </div>
        
        <div class="col s12 m4">
            <div class="card orange lighten-1">
                <div class="card-content white-text">
                    <span class="card-title">Profile</span>
                    <p>Update your information</p>
                </div>
                <div class="card-action">
                    <a href="{{ url_for('lecturer.profile') }}" class="white-text">View Profile</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
